[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dilemma-bench"
version = "0.2.0"
description = "Controlled prompt interventions on written moral judgments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dilemma-bench = "dilemma_bench.cli:main"

[tool.setuptools.packages.find]
include = ["dilemma_bench*"]
